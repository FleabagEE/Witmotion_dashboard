openapi: 3.1.0

info:
  title: QuakeVault Industrial API
  version: "1.1.0"
  description: |
    Structural vibration monitoring appliance.

    This document is verified mechanically, not maintained by hand. `ContractTest`
    checks it against the running application in both directions: a route in the
    application but missing here is undocumented, and a route here but missing
    from the application is a stale promise. Both fail the build.

    Response schemas are validated against live responses, so a field that
    changes shape without this file changing will fail too.

    **Fields that carry judgement, not just data.** Several responses include
    fields whose purpose is to stop a number being trusted more than it should
    be. They are marked in the schemas below and none of them are optional:

      - `verification_status` / `trustworthy` — whether the sensor's register map
        was ever confirmed against hardware
      - `quality` — `good`, `implausible` or `bad`
      - `source_type` — `native`, `derived`, `processed` or `simulated`
      - `provisional` / `actionable` — whether an alarm's threshold has been
        confirmed against the published standard by a named person
      - `allowed` / `transient` — whether a spectrum is defensible at all

servers:
  - url: http://127.0.0.1:8000
    description: Appliance, local

tags:
  - name: auth
  - name: read
  - name: alarms
  - name: admin
    description: Administrator only. Requires the `administer` ability.
  - name: ingest
    description: Appliance-only. Requires the `ingest` ability and nothing else.

security:
  - bearerAuth: []

paths:

  /api/v1/login:
    post:
      tags: [auth]
      summary: Exchange credentials for a token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                device_name: { type: string }
      responses:
        "200":
          description: Token issued
          content:
            application/json:
              schema:
                type: object
                required: [token, user]
                properties:
                  token: { type: string }
                  user: { $ref: "#/components/schemas/User" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/logout:
    post:
      tags: [auth]
      summary: Revoke the current token
      responses:
        "200": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/me:
    get:
      tags: [auth]
      summary: The current user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/overview:
    get:
      tags: [read]
      summary: Appliance summary
      description: Requires the `read` ability.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [generated_at, sensors]
                properties:
                  generated_at: { type: string, format: date-time }
                  sensors:
                    type: object
                    required: [total, online, silent]
                    properties:
                      total: { type: integer }
                      online: { type: integer }
                      silent: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/sensors:
    get:
      tags: [read]
      summary: Every sensor, with how far it can be trusted
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Sensor" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/sensors/{sensorId}/channels:
    get:
      tags: [read]
      summary: Channel metadata for a sensor
      parameters:
        - { name: sensorId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { type: object } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/sensors/{sensorId}/latest:
    get:
      tags: [read]
      summary: The newest reading on every channel
      parameters:
        - { name: sensorId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Reading" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/series:
    get:
      tags: [read]
      summary: One channel over time
      parameters:
        - { name: sensor_id, in: query, required: true, schema: { type: string } }
        - { name: channel_key, in: query, required: true, schema: { type: string } }
        - { name: seconds, in: query, schema: { type: integer, default: 300 } }
        - { name: max_points, in: query, schema: { type: integer, default: 300 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MultiSeries" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/series/multi:
    get:
      tags: [read]
      summary: Several channels in one request
      description: |
        One request rather than several on purpose. Splitting them would let each
        half land at a slightly different moment, which on a chart reads as a
        skew between cards that is not in the structure.

        At most 20 channels.
      parameters:
        - { name: sensor_id, in: query, required: true, schema: { type: string } }
        - name: channels
          in: query
          required: true
          description: Comma-separated, maximum 20
          schema: { type: string }
        - name: seconds
          in: query
          description: |
            1 to 604800. The floor is one second, not ten: the live page offers
            2 and 5 second windows for watching a single impact land.
          schema: { type: integer, default: 300, minimum: 1, maximum: 604800 }
        - { name: max_points, in: query, schema: { type: integer, default: 300 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MultiSeries" }
        "422":
          description: More than 20 channels, or a missing parameter
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/spectrum:
    get:
      tags: [read]
      summary: Frequency content, with a gate in front of it
      description: |
        Read `analysis.allowed` before `analysis.spectrum`. When the requested
        band exceeds 0.4 x the measured sample rate the response carries
        `spectrum: null` and an explanation instead of a chart.

        Read `spectrum.transient` too. A periodogram assumes a stationary signal;
        a short burst in a long window produces a confident peak that describes
        the window length rather than the structure, and no component is reported
        when that is detected.
      parameters:
        - { name: sensor_id, in: query, required: true, schema: { type: string } }
        - { name: channel_key, in: query, required: true, schema: { type: string } }
        - { name: seconds, in: query, schema: { type: integer, default: 300 } }
        - { name: requested_hz, in: query, schema: { type: number } }
      responses:
        "200":
          description: OK. May legitimately carry no spectrum.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpectrumResponse" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/tilt:
    get:
      tags: [read]
      summary: Structure movement against the commissioning baseline
      description: |
        Settlement monitoring. Everything is reported against a baseline captured
        at commissioning rather than against zero: a silo built 0.4 degrees off
        plumb is fine and stays fine, and the change is what matters.

        Three deviation figures are returned where a naive response would return
        one - the raw movement, the part temperature accounts for, and the
        remainder. Reporting only the remainder would hide how much was explained
        away, and a compensation nobody can inspect is a place for a real signal
        to disappear.

        `baseline: null` means the sensor has not been commissioned and nothing
        is being monitored.
      parameters:
        - { name: sensor_id, in: query, schema: { type: string } }
        - name: days
          in: query
          description: Window for the series and the thermal fit. Default 7.
          schema: { type: integer, minimum: 1, maximum: 3650, default: 7 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [generated_at, window_days, sensors]
                properties:
                  generated_at: { type: string }
                  window_days: { type: [integer, string] }
                  sensors:
                    type: array
                    items: { $ref: "#/components/schemas/TiltSensor" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/alarms:
    get:
      tags: [alarms]
      summary: Alarm events
      parameters:
        - name: unacknowledged_only
          in: query
          schema: { type: string, enum: ["0", "1"] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Alarm" }

  /api/v1/alarms/{alarm}/acknowledge:
    post:
      tags: [alarms]
      summary: Record that a person accepted an alarm
      description: |
        Requires the `acknowledge` ability. A kiosk token cannot do this: an
        acknowledgement is a person taking responsibility, and it must be
        attributable to that person rather than to a screen anyone can reach.
      parameters:
        - { name: alarm, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string }
      responses:
        "200": { description: Acknowledged }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/internal/v1/ingest/health:
    get:
      tags: [ingest]
      summary: Ingestion contract check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status, schema_version]
                properties:
                  status: { type: string }
                  schema_version: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/internal/v1/ingest/batch:
    post:
      tags: [ingest]
      summary: Submit measurements
      description: |
        Idempotent on `appliance_id:run_id:sensor_id:group:sequence`. A forwarder
        that crashes mid-batch re-offers the same envelopes; the replay is a
        no-op, not a duplicate.

        `run_id` is in that key because sequence numbers restart at 1 on each
        service start. Without it a replay after a restart collided with the
        previous run and 98 measurements were silently discarded.

        Send microseconds in `timestamp_utc`. Whole seconds collapse the readings
        of one second onto a single timestamp and cap spectral analysis at
        0.4 Hz.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [measurements]
              properties:
                measurements:
                  type: array
                  maxItems: 1000
                  items: { $ref: "#/components/schemas/Envelope" }
      responses:
        "202":
          description: |
            Accepted. May be partial - check `rejected`. Accepted envelopes are
            already stored; rejected ones are listed with an index and a reason.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestResult" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/internal/v1/ingest/profile:
    post:
      tags: [ingest]
      summary: Announce a sensor profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: Recorded }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/alarm-definitions:
    get:
      tags: [alarms]
      summary: The numbers alarms are judged against
      description: |
        Readable by anyone with `read`. An operator who cannot see the threshold
        cannot judge whether an alarm matters.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AlarmDefinition" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/alarm-definitions/{definition}:
    patch:
      tags: [alarms]
      summary: Change a threshold
      description: |
        Requires `administer` — the highest ability the appliance has, above the
        `configure` an engineer holds. Raising a limit silences an alarm and
        leaves the dashboard looking healthy, which is indistinguishable from a
        structure that stopped moving, so the change is audited with both values
        and a mandatory reason.

        **Changing any of the numbers clears the confirmation.** A signature
        given for 3 degrees is not a signature for 12, and the appliance must not
        page anyone on the authority of one that was given for something else.
        Toggling `enabled` or widening a timer does not clear it.
      parameters:
        - { name: definition, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                advisory_at: { type: [number, "null"] }
                warning_at: { type: [number, "null"] }
                critical_at: { type: [number, "null"] }
                hysteresis: { type: number, minimum: 0 }
                persistence_seconds: { type: integer, minimum: 0, maximum: 86400 }
                clear_seconds: { type: integer, minimum: 0, maximum: 604800 }
                debounce_seconds: { type: integer, minimum: 0, maximum: 86400 }
                latching: { type: boolean }
                enabled: { type: boolean }
                reason:
                  type: string
                  minLength: 3
                  description: Why. Recorded in the audit trail; not optional.
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [data, confirmation_cleared]
                properties:
                  data: { $ref: "#/components/schemas/AlarmDefinition" }
                  confirmation_cleared:
                    type: boolean
                    description: |
                      True when this edit invalidated an existing sign-off. The
                      dashboard will look calmer afterwards and the reason must
                      not be a surprise.
        "403": { description: Requires the administer ability }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/alarm-definitions/{definition}/confirm:
    post:
      tags: [alarms]
      summary: Record that a named person checked these numbers
      description: |
        Separate from an edit on purpose. Confirming asserts something about the
        outside world — that somebody opened the standard or the engineer's
        report and checked. Letting it ride along with an edit would allow
        signing off one's own change in the same breath.

        Until this is done, alarms from the definition are displayed and never
        sent, whatever notification channels exist.
      parameters:
        - { name: definition, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmed_by, reference]
              properties:
                confirmed_by: { type: string, description: The person accountable. }
                reference: { type: string, description: What was checked against. }
                note: { type: string }
      responses:
        "200":
          description: Confirmed
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/AlarmDefinition" }
        "403": { description: Requires the administer ability }

  /api/v1/users:
    get:
      tags: [admin]
      summary: Every account, with its role and abilities
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/ManagedUser" } }
        "403": { description: Requires the administer ability }
    post:
      tags: [admin]
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, role, password]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                role: { type: string, enum: [viewer, operator, engineer, administrator, auditor, kiosk] }
                password: { type: string, minLength: 12 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ManagedUser" }
        "403": { description: Requires the administer ability }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/users/{user}:
    patch:
      tags: [admin]
      summary: Change a role, or activate and deactivate
      description: |
        Two refusals are enforced here rather than in the interface, because a
        hidden button still permits the request: an administrator may not remove
        their own administrator role, and the last active administrator may not
        be demoted or deactivated. Either is one click from an appliance in a
        plant room that nobody can administer.

        Deactivating also revokes every token for that account. A deactivated
        user with a live session is not deactivated.
      parameters:
        - { name: user, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                role: { type: string }
                active: { type: boolean }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ManagedUser" }
        "403": { description: Requires the administer ability }
        "422": { description: Refused - would leave the appliance without an administrator }

  /api/v1/users/{user}/password:
    post:
      tags: [admin]
      summary: Set a new password and revoke every session
      parameters:
        - { name: user, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 12 }
      responses:
        "200":
          description: Reset
          content:
            application/json:
              schema:
                type: object
                required: [data, sessions_revoked]
                properties:
                  data: { $ref: "#/components/schemas/ManagedUser" }
                  sessions_revoked:
                    type: integer
                    description: |
                      A password change that leaves old sessions alive has not
                      locked anybody out.
        "403": { description: Requires the administer ability }

  /api/v1/roles:
    get:
      tags: [admin]
      summary: The roles on offer and what each may do
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [role, abilities]
                      properties:
                        role: { type: string }
                        abilities: { type: array, items: { type: string } }
        "403": { description: Requires the administer ability }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  responses:
    Unauthorized:
      description: No token, or the token is invalid
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: The token lacks the ability this route requires
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such sensor, alarm or channel
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: The body names the offending field
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:

    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
        errors: { type: object }

    User:
      type: object
      required: [name, email, role]
      properties:
        name: { type: string }
        email: { type: string }
        role:
          type: string
          enum: [kiosk, viewer, operator, engineer, auditor, administrator]

    Sensor:
      type: object
      required: [sensor_id, verification_status, trustworthy, online]
      properties:
        sensor_id: { type: string }
        model: { type: [string, "null"] }
        verification_status:
          type: [string, "null"]
          description: |
            Travels with every sensor deliberately. A reading from a sensor whose
            register map was never confirmed is a picture of an assumption.
        trustworthy: { type: boolean }
        online: { type: boolean }
        silent_for_seconds: { type: [integer, "null"] }

    Reading:
      type: object
      required: [channel_key, value, unit, quality, source_type, at]
      properties:
        channel_key: { type: string }
        value:
          type: [number, "null"]
          description: |
            Null means the channel read nothing. It is never filled with 0 or the
            previous value - plotted as zero it would look like a still structure
            rather than absent data.
        unit: { type: string }
        quality:
          type: string
          enum: [good, implausible, bad]
        source_type:
          type: string
          enum: [native, derived, processed, simulated]
          description: |
            `derived` covers inclination, computed from the gravity vector
            because this sensor has no angle register. `processed` means a
            calibration was applied.
        at: { type: string }

    SeriesPoint:
      type: object
      required: [t, v, lo, hi]
      properties:
        t: { type: integer, description: "Epoch milliseconds, bucket start" }
        v: { type: [number, "null"], description: Mean within the bucket }
        lo:
          type: [number, "null"]
          description: |
            Minimum within the bucket. Present so downsampling cannot hide a
            transient - averaging alone would erase exactly the peak a vibration
            limit is written against.
        hi: { type: [number, "null"] }

    MultiSeries:
      type: object
      required: [resolution, series]
      properties:
        resolution:
          type: string
          enum: [raw_bucketed, hourly_rollup]
          description: "`hourly_rollup` has peaks flattened; the dashboard says so."
        series:
          type: object
          additionalProperties:
            type: array
            items: { $ref: "#/components/schemas/SeriesPoint" }

    SpectrumResponse:
      type: object
      required: [sensor_id, channel_key, window_seconds, analysis]
      properties:
        sensor_id: { type: string }
        channel_key: { type: string }
        unit: { type: [string, "null"] }
        window_seconds: { type: [integer, string] }
        verification_status: { type: [string, "null"] }
        analysis: { $ref: "#/components/schemas/SpectrumAnalysis" }
        device_reported:
          type: [object, "null"]
          description: |
            The sensor's own dominant-frequency reading, computed on-device at
            full rate and valid to 300 Hz. Ours stops at a few Hz. Both travel
            together because either alone would mislead.

    SpectrumAnalysis:
      type: object
      required: [samples, samples_available, decimation, sample_hz, jitter_ms, span_seconds, allowed, explanation, spectrum]
      properties:
        samples: { type: integer }
        samples_available: { type: integer }
        decimation:
          type: integer
          description: "Greater than 1 means the window was thinned. Surfaced, never silent."
        sample_hz: { type: [number, "null"] }
        jitter_ms: { type: [number, "null"] }
        span_seconds: { type: number }
        defensible_max_hz: { type: number }
        nyquist_hz: { type: number }
        requested_hz: { type: number }
        allowed:
          type: boolean
          description: "False means `spectrum` is null and `explanation` says why."
        explanation: { type: string }
        spectrum:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Spectrum"

    Spectrum:
      type: object
      required: [frequencies, power, min_hz, peak_hz, peak_power, false_alarm_probability, peak_significant, detrended, transient]
      properties:
        frequencies: { type: array, items: { type: number } }
        power: { type: array, items: { type: number } }
        min_hz: { type: number }
        peak_hz: { type: number }
        peak_power: { type: number }
        false_alarm_probability: { type: number }
        peak_significant:
          type: boolean
          description: |
            False means the tallest bar is indistinguishable from noise and must
            not be read as a finding.
        detrended: { type: boolean }
        trend_bins_excluded: { type: integer }
        lowest_reportable_hz: { type: number }
        energy_concentration: { type: number }
        transient:
          type: boolean
          description: |
            True means the window holds an event rather than sustained vibration.
            No component is reported however bright it looks.
        transient_note: { type: [string, "null"] }

    Alarm:
      type: object
      required: [id, level, state, provisional, actionable]
      properties:
        id: { type: integer }
        name: { type: [string, "null"] }
        sensor_id: { type: integer }
        channel_key: { type: string }
        level: { type: string, enum: [normal, warning, critical] }
        peak_level: { type: string }
        state: { type: string }
        value: { type: [number, "null"] }
        threshold: { type: [number, "null"] }
        unit: { type: [string, "null"] }
        raised_at: { type: [string, "null"] }
        acknowledged_at: { type: [string, "null"] }
        provisional:
          type: boolean
          description: |
            The threshold came from a table nobody has confirmed against the
            published standard. A provisional alarm is displayed and never
            notifies.
        actionable: { type: boolean }
        thresholds_confirmed_by: { type: [string, "null"] }

    TiltSensor:
      type: object
      required: [sensor_id, baseline, deviation, thermal_model, series]
      properties:
        sensor_id: { type: string }
        verification_status: { type: [string, "null"] }
        baseline:
          oneOf:
            - type: "null"
            - type: object
              required: [tilt, temp, samples, captured_at]
              properties:
                tilt: { type: number }
                roll: { type: number }
                pitch: { type: number }
                temp:
                  type: number
                  description: |
                    The temperature the baseline was taken at. A deviation is
                    meaningless without it, because the correction is measured
                    from here.
                samples: { type: integer }
                captured_at: { type: string }
                resolution_deg: { type: number }
        deviation:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/TiltDeviation"
        thermal_model:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/TiltThermalModel"
        series:
          type: object
          required: [bucket, points]
          properties:
            bucket:
              type: string
              description: Chosen from the window - a year of five-minute buckets is unreadable.
            bucket_seconds:
              type: integer
              description: Bucket width, so a client can draw a band the right size.
            commissioned_at:
              oneOf:
                - type: "null"
                - type: string
                  format: date-time
              description: |
                When the baseline was captured. Movement is undefined before it,
                so points earlier than this carry a null deviation.
            points:
              type: array
              items: { $ref: "#/components/schemas/TiltPoint" }

    TiltDeviation:
      type: object
      required: [available]
      properties:
        available: { type: boolean }
        reason: { type: string }
        samples:
          type: integer
          description: Samples that survived the disturbance filter, not samples recorded.
        disturbed_minutes:
          type: integer
          description: |
            Minutes of the window discarded because the sensor was being handled.
            Averaged in, two such minutes moved an hourly deviation from 0.008 to
            0.646 degrees, so they are dropped - and counted here, because a
            deviation averaged over three surviving minutes deserves less trust
            than one averaged over sixty.
        window_minutes:
          type: integer
          description: The averaging window the deviation was taken over.
        tilt_now: { type: number }
        temperature_now: { type: number }
        raw_deviation: { type: number }
        thermal_component:
          type: number
          description: |
            How much of the movement temperature accounts for. Reported rather
            than silently removed.
        corrected_deviation:
          type: number
          description: The movement temperature does not explain. This is what is alarmed.
        compensated:
          type: boolean
          description: False means no usable thermal model, so the figure is uncorrected.

    TiltThermalModel:
      type: object
      required: [samples, correlation, slope, temp_range, tilt_range, significant, disturbed]
      properties:
        samples: { type: integer }
        correlation: { type: number }
        slope: { type: number, description: Degrees of apparent tilt per degree C. }
        temp_range: { type: number }
        tilt_range: { type: number }
        significant:
          type: boolean
          description: |
            True only when the fit can be extrapolated - at least 2 degC of range
            and no re-orientation in the window.
        disturbed:
          type: boolean
          description: |
            Tilt moved more than a degree, so the window contains a physical move
            and no thermal model can be separated from it.

    TiltPoint:
      type: object
      required: [t, tilt, temperature, deviation, disturbed, disturbed_minutes, total_minutes, pre_commissioning]
      properties:
        t: { type: integer }
        tilt:
          type: [number, "null"]
          description: |
            Absolute tilt from vertical, averaged over the quiet minutes of the
            bucket. Present for the whole window, including before commissioning.
        roll: { type: [number, "null"] }
        pitch: { type: [number, "null"] }
        temperature:
          type: [number, "null"]
          description: |
            Deliberately NOT filtered for disturbance. It stays a true reading of
            the chip while the sensor is handled, and the second axis exists to
            compare movement against it - a trace full of holes would defeat that.
        deviation:
          type: [number, "null"]
          description: |
            Movement from the baseline. Null before commissioning and for buckets
            with no quiet minutes, so the plotted line breaks rather than being
            bridged across time nobody measured.
        disturbed:
          type: boolean
          description: |
            The sensor was handled in this interval. A step in the trace here is
            not settlement.
        disturbed_minutes: { type: integer }
        total_minutes: { type: integer }
        pre_commissioning:
          type: boolean
          description: |
            The bucket predates the baseline, so movement is undefined for it.
            Returned rather than dropped so a client can shade the period: the
            excluded history stays visible without setting the scale of an axis
            that has to resolve hundredths of a degree.

    AlarmDefinition:
      type: object
      required: [id, key, name, enabled, actionable]
      properties:
        id: { type: integer }
        key: { type: string }
        name: { type: string }
        sensor_id: { type: [string, "null"] }
        channel_key: { type: [string, "null"] }
        condition_type: { type: string }
        unit: { type: [string, "null"] }
        advisory_at: { type: [number, "null"] }
        warning_at: { type: [number, "null"] }
        critical_at: { type: [number, "null"] }
        hysteresis: { type: [number, "null"] }
        persistence_seconds: { type: [integer, "null"] }
        clear_seconds: { type: [integer, "null"] }
        debounce_seconds: { type: [integer, "null"] }
        latching: { type: [boolean, "null"] }
        enabled: { type: boolean }
        thresholds_confirmed_by: { type: [string, "null"] }
        thresholds_confirmed_at: { type: [string, "null"], format: date-time }
        thresholds_reference: { type: [string, "null"] }
        actionable:
          type: boolean
          description: |
            False means alarms from this definition are displayed and never sent,
            whatever channels exist. Nobody has put their name to the numbers.

    ManagedUser:
      type: object
      required: [id, name, email, role, abilities, active]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string }
        abilities: { type: array, items: { type: string } }
        active: { type: boolean }
        last_login_at: { type: [string, "null"], format: date-time }
        created_at: { type: [string, "null"], format: date-time }

    Envelope:
      type: object
      required: [appliance_id, run_id, sensor_id, group, sequence, timestamp_utc, measurements]
      properties:
        schema_version: { type: string }
        appliance_id: { type: string }
        run_id: { type: string }
        sensor_id: { type: string }
        sensor_model: { type: string }
        profile_version: { type: string }
        group: { type: string }
        sequence: { type: integer }
        timestamp_utc:
          type: string
          description: ISO 8601 with microseconds. Preserved end to end.
        simulated: { type: boolean }
        quality: { type: object }
        measurements:
          type: object
          additionalProperties:
            type: object
            properties:
              value: { type: [number, "null"] }
              unit: { type: string }
              quality: { type: string, enum: [good, implausible, bad, stale] }
              class: { type: string }
              raw:
                type: array
                items: { type: integer }
                description: |
                  The register words. Worth sending: keeping them is what allowed
                  143 rows to be recomputed when a decode was found wrong months
                  later. Without them the only correct response would have been
                  to discard the affected history.

    IngestResult:
      type: object
      required: [batch_uid, offered, accepted, duplicates, rejected]
      properties:
        batch_uid: { type: string }
        offered: { type: integer }
        accepted: { type: integer }
        duplicates:
          type: integer
          description: Replay safety, not an error.
        rejected: { type: integer }
        alarms_changed: { type: integer }
        errors:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              error: { type: string }
