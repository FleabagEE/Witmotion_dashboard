# QuakeVault MQTT broker.
#
# Outbound integration only. Measurements enter the system through the
# authenticated ingestion API, never through MQTT, so a compromised broker
# cannot inject readings into the historical record.

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type warning
log_type error

# No anonymous access, ever. An unauthenticated broker on a plant network is an
# open invitation to publish forged alarms.
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

listener 1883 0.0.0.0
max_queued_messages 1000
message_size_limit 262144

# TLS listener, enabled by mounting certificates. Left commented rather than
# half-configured: a listener that silently falls back to plaintext is worse
# than one that is obviously absent.
# listener 8883 0.0.0.0
# certfile /mosquitto/certs/server.crt
# keyfile  /mosquitto/certs/server.key
# cafile   /mosquitto/certs/ca.crt
# require_certificate false
