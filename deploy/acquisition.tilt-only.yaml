# QuakeVault acquisition configuration.
#
# Installed to /etc/quakevault/acquisition.yaml. Validate any change before
# restarting the service:
#
#   sudo -u quakevault-acq /var/www/quakevault-industrial/.venv/bin/python \
#       -m qv_acq.service --check --config /etc/quakevault/acquisition.yaml
#
# The service refuses to start on a sensor whose profile is not `verified`, so a
# register map that has not been confirmed cannot reach production by accident.

appliance_id: QV-EDGE-001

spool:
  path: /var/lib/quakevault-acq/spool.db
  max_rows: 500000
  # true  = bounded disk, oldest undelivered data sacrificed when full (counted, never silent)
  # false = never discard undelivered data, accept unbounded growth instead
  drop_undelivered_when_full: true

metrics:
  path: /var/lib/quakevault-acq/metrics.prom
  interval_seconds: 10
  enabled: true

forwarder:
  enabled: true
  base_url: http://127.0.0.1:8000/api/internal/v1/ingest
  # The credential itself lives in /etc/quakevault/forwarder.env (mode 0600),
  # never in this file, which is world-readable and version-controlled.
  token_env: QV_INGEST_TOKEN
  batch_size: 200
  # One second, not five. The forwarder interval is the dominant term in
  # end-to-end latency: everything upstream is sub-second, so a five-second
  # drain made a live waveform lag by five seconds for no other reason.
  interval_seconds: 1
  announce_profiles: true

buses:
  - bus_id: BUS-001
    adapter_id: RS485-ADAPTER-001
    # Always a stable alias from the udev rules, never /dev/ttyUSB0: the kernel
    # name renumbers across reboots and replugs.
    port: /dev/quakevault-rs485-a
    baud: 9600
    timeout: 1.0
    retry_max_attempts: 2
    breaker_failure_threshold: 3
    breaker_cooldown_seconds: 5.0
    sensors:
      - sensor_id: SENSOR-001
        model: WTVB01-485
        slave_id: 0x50
        groups:
          # Tilt-only settlement monitoring. `motion` stays because tilt is
          # derived from the gravity vector in accel_x/y/z, and that group is a
          # single 19-register transaction that also carries the chip
          # temperature the thermal model needs and the acceleration amplitude
          # the disturbance filter needs. Dropping channels from it would save
          # no bus time - they arrive in the same read.
          #
          # The condition_* groups are vibration condition indicators. Nothing
          # in settlement monitoring reads them.
          - motion
          # Kept. It is the only channel that reports the sensor accusing
          # itself of a fault, and a settlement monitor that stops being
          # believed is worse than one that stops reporting.
          - fault_diagnosis
        # Rates must fit the bus. Measured utilisation at the previous rates was
        # 0.35, so roughly two thirds of the bus was idle; these rates target
        # about 0.70 and leave headroom for retries. See
        # docs/known-limitations.md for the capacity model.
        #
        # The fast-moving quantities get the bandwidth. Condition indicators and
        # fault words change slowly and are computed on-device anyway, so polling
        # them harder buys nothing but bus time.
        poll_hz:
          # 1 Hz, down from 10.
          #
          # The rate that mattered for live vibration is close to pointless for
          # settlement, and not because settlement is slow - because the sensor
          # cannot deliver independent samples any faster. Its tilt output is
          # first-order filtered with a time constant measured at about 9
          # seconds (63.2% at 9 s, 95% at 28 s, 99% at 44 s). Consecutive
          # samples taken 0.1 s apart are almost the same sample, so averaging
          # 36 000 of them per hour does not buy 36 000 samples' worth of
          # resolution - the independent count is set by the filter, near 400
          # per hour, at either rate.
          #
          # What the reduction does buy:
          #   bus utilisation   ~0.65 -> ~0.07, ample room for a second sensor
          #   stored rows       ~13.8M/day -> ~1.4M/day
          #   resolution        unchanged, because it was never rate-limited
          #
          # Disturbance detection still works: handling lasts seconds to
          # minutes, and the filter is per-minute.
          motion: 1
          fault_diagnosis: 0.1
