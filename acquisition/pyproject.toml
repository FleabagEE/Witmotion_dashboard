[project]
name = "qv-acq"
version = "0.1.0"
description = "QuakeVault industrial Modbus acquisition service"
requires-python = ">=3.12"
dependencies = ["pymodbus>=3.6", "pyserial>=3.5", "pydantic>=2.6", "pyyaml>=6.0"]

# Console entry points, so the operator-facing tools are a command rather than
# a python -m incantation with PYTHONPATH set. The documented probe command
# failed for exactly that reason: the package had never been installed into the
# venv, and only the systemd units carried the path.
[project.scripts]
qv-acq = "qv_acq.service:main"
qv-forwarder = "qv_acq.forwarder_service:main"
qv-probe = "qv_acq.probe:main"
qv-calibrate = "qv_acq.calibrate_cli:main"
qv-set-address = "qv_acq.address_cli:main"
qv-spool = "qv_acq.spool_cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
