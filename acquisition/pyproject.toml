[project]
name = "qv-acq"
version = "0.1.0"
description = "QuakeVault industrial Modbus acquisition service"
requires-python = ">=3.12"
dependencies = ["pymodbus>=3.6", "pyserial>=3.5", "pydantic>=2.6", "pyyaml>=6.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
