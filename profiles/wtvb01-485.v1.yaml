schema_version: "1.0"
profile_version: "1.1.0"
manufacturer: WitMotion
model: WTVB01-485
protocol: modbus_rtu

# VERIFIED against the manufacturer register table AND the connected unit.
# Source: "WTVB01-485 Datasheet and User Guide", document V260508, section 10.3
# (register address table) and 10.4 (per-register scaling formulas).
# Device firmware package: Version 10059.
verification_status: verified
verification_notes: >-
  Cross-checked two ways on 2026-07-31. (1) Every address and scale factor below
  is transcribed from the manufacturer's register table and its per-register
  formulas, not inferred. (2) Each block was confirmed live on the connected unit
  at slave 0x50, 9600 baud, over 585 samples across two stimulus captures.
  Acceleration was independently validated: the three axes at rest sum to a
  vector magnitude of 0.993 g, which only the correct scale factor produces.
  Temperature read 24.2 degC against a plausibly 24 degC room.

  CORRECTION 2026-08-03, profile 1.0.0 -> 1.1.0. Vibration velocity (0x3A-0x3C)
  and displacement (0x41-0x43) were decoded as signed. They are magnitudes and
  are unsigned; a signed read inverts every value above 32767 counts, i.e. above
  327.67 mm/s or 32767 um. Neither the manufacturer's table nor 585 samples of
  bench data caught it, because a stationary sensor never approaches the
  boundary. Three seconds of hand-shaking did: raw 31932 read +319.32 mm/s and
  the next sample, raw 33530, read -320.06.

  This is the failure mode the verification gate is least able to catch on its
  own - a decode that is correct across the whole range the sensor happens to be
  exercised over, and wrong in exactly the regime the instrument exists to
  measure. Dominant frequency (0x44-0x46) is corrected to unsigned at the same
  time on the same reasoning, though it never approaches the boundary in
  practice.

  Acceleration (0x34-0x36) and temperature (0x40) remain signed, which is
  correct: both take genuinely negative values, and acceleration is independently
  confirmed by the three axes summing to 0.993 g at rest.

  OPEN: the 36 condition indicators (0x47-0x6A) are still decoded as signed and
  have NOT been re-examined. Some must be signed - skewness is negative for a
  left-tailed distribution - while others, such as RMS and absolute average,
  cannot be. They sit near zero on this bench and so carry the same latent risk
  velocity did. Treat as unverified in the large-amplitude regime.

  Registers 0x37-0x39 are live on this unit and respond to excitation, but they
  do NOT appear in the manufacturer's register table at all - it jumps from 0x36
  to 0x3A. They are almost certainly the underlying IMU's angular-velocity
  registers, exposed but unsupported. They are deliberately NOT included here: an
  undocumented register may move or disappear in a firmware revision.

serial:
  baud: 9600
  default_slave_id: 0x50
  turnaround_ms: 5.0
  supported_bauds: [4800, 9600, 19200, 38400, 57600, 115200, 230400]

register_groups:
  # Acceleration. Manual 10.4.5: AX = AX[15:0]/32768*16 g.
  - key: acceleration
    label: Triaxial acceleration
    function_code: 3
    default_poll_hz: 10
    channels:
      - {key: accel_x, label: Acceleration X, quantity: acceleration, unit: g, address: 0x34, scale: 0.00048828125, minimum: -16, maximum: 16}
      - {key: accel_y, label: Acceleration Y, quantity: acceleration, unit: g, address: 0x35, scale: 0.00048828125, minimum: -16, maximum: 16}
      - {key: accel_z, label: Acceleration Z, quantity: acceleration, unit: g, address: 0x36, scale: 0.00048828125, minimum: -16, maximum: 16}

  # Vibration velocity. Manual 10.4.6: VX (mm/s) = raw/100.
  #
  # UNSIGNED. This was wrong until 2026-08-03 and only a hard shake revealed it.
  # Decoded as int16, a raw word of 33530 became -320.06 mm/s while the sample
  # before it, raw 31932, read +319.32 - a 640 mm/s discontinuity between two
  # adjacent readings of a smoothly rising magnitude. Vibration velocity here is
  # a magnitude and never negative; above 327.67 mm/s a signed read wraps and
  # inverts it. That is precisely the large-event regime structural monitoring
  # exists for.
  #
  # The maximum is the full representable range, not a device limit. The
  # previous 120 mm/s was tighter than the hardware actually outputs - readings
  # above 300 mm/s were observed - and it flagged real event data as
  # implausible, which the spectrum endpoint then excluded. A plausibility bound
  # that rejects genuine large events is worse than a loose one.
  # 0.01 mm/s per count resolves the ISO 10816 zone boundaries (1.12 / 2.8 /
  # 7.1 mm/s) with room to spare.
  - key: vibration_velocity
    label: Triaxial vibration velocity
    function_code: 3
    default_poll_hz: 5
    channels:
      - {key: vib_velocity_x, label: Vibration velocity X, quantity: vibration_velocity, unit: mm/s, address: 0x3A, data_type: uint16, scale: 0.01, minimum: 0, maximum: 655.35}
      - {key: vib_velocity_y, label: Vibration velocity Y, quantity: vibration_velocity, unit: mm/s, address: 0x3B, data_type: uint16, scale: 0.01, minimum: 0, maximum: 655.35}
      - {key: vib_velocity_z, label: Vibration velocity Z, quantity: vibration_velocity, unit: mm/s, address: 0x3C, data_type: uint16, scale: 0.01, minimum: 0, maximum: 655.35}

  # Temperature, displacement and frequency read as one contiguous span:
  # 0x40 TEMP, 0x41-0x43 DX-DZ, 0x44-0x46 HZX-HZZ. One transaction is cheaper
  # than three, and the engine tolerates the gap-free layout here.
  - key: vibration_summary
    label: Temperature, displacement and dominant frequency
    function_code: 3
    default_poll_hz: 5
    channels:
      # Manual 10.4.8: Temperature = TEMP[15:0]/100 degC.
      - {key: temperature, label: Chip temperature, quantity: temperature, unit: degC, address: 0x40, scale: 0.01, minimum: -40, maximum: 125}
      # UNSIGNED, for the same reason as velocity: a displacement magnitude
      # crossing 32767 um wrapped negative. Observed raw 33324 reading as
      # -32212 um directly after raw 32707 read +32707.
      # Manual 10.4.9: DX(um) = raw, no scaling. Note the summary table's
      # "mm" units column contradicts the detailed section, which states um and
      # gives a formula with no divisor. The detailed section governs.
      - {key: vib_displacement_x, label: Vibration displacement X, quantity: vibration_displacement, unit: um, address: 0x41, data_type: uint16, scale: 1.0, minimum: 0, maximum: 65535}
      - {key: vib_displacement_y, label: Vibration displacement Y, quantity: vibration_displacement, unit: um, address: 0x42, data_type: uint16, scale: 1.0, minimum: 0, maximum: 65535}
      - {key: vib_displacement_z, label: Vibration displacement Z, quantity: vibration_displacement, unit: um, address: 0x43, data_type: uint16, scale: 1.0, minimum: 0, maximum: 65535}
      # Manual 10.4.10: HZX (Hz) = raw/10.
      - {key: vib_frequency_x, label: Dominant frequency X, quantity: dominant_frequency, unit: Hz, address: 0x44, data_type: uint16, scale: 0.1, minimum: 0, maximum: 300}
      - {key: vib_frequency_y, label: Dominant frequency Y, quantity: dominant_frequency, unit: Hz, address: 0x45, data_type: uint16, scale: 0.1, minimum: 0, maximum: 300}
      - {key: vib_frequency_z, label: Dominant frequency Z, quantity: dominant_frequency, unit: Hz, address: 0x46, data_type: uint16, scale: 0.1, minimum: 0, maximum: 300}

  # Device clock. Manual 10.4.4. Packed byte pairs, decoded by the engine rather
  # than scaled, so they are exposed as diagnostics only.
  - key: device_time
    label: On-chip time
    function_code: 3
    default_poll_hz: 1
    channels:
      - {key: time_yymm, label: Year and month, quantity: device_time, unit: packed, address: 0x30, data_type: uint16}
      - {key: time_ddhh, label: Day and hour, quantity: device_time, unit: packed, address: 0x31, data_type: uint16}
      - {key: time_mmss, label: Minute and second, quantity: device_time, unit: packed, address: 0x32, data_type: uint16}
      - {key: time_ms, label: Millisecond, quantity: device_time, unit: ms, address: 0x33, data_type: uint16, minimum: 0, maximum: 1000}

  # Per-axis condition indicators. Manual 10.4.11 (X, 0x47-0x52), 10.4.12
  # (Y, 0x53-0x5E) and 10.4.13 (Z, 0x5F-0x6A). Every one is raw/1000.
  #
  # These matter more than they look. The device computes them internally from
  # its own high-rate sampling, so they are NOT limited by our polling rate -
  # this is how the appliance does real condition monitoring despite the Modbus
  # bandwidth ceiling documented in known-limitations.md.
  #
  # MANUAL DISCREPANCY, resolved in favour of the detailed section. The summary
  # table in 10.3 lists the X block as 0x47-0x4C then jumps to 0x50 PIX, 0x51
  # VKX, 0x52 DRMSX, leaving 0x4D-0x4F unlisted. But 10.4.11 states the block is
  # "71~82 (0x47~0x52)" and names twelve registers in order, and the Y and Z
  # summary tables are both plain twelve-register runs with no gaps. Hardware
  # agrees with the detailed section: 0x4D-0x4F carry live acceleration
  # statistics, while 0x50-0x52 sit at zero exactly like their Y counterparts
  # 0x5C-0x5E and Z counterparts 0x68-0x6A. The consecutive layout is used.
  - key: condition_x
    label: X-axis condition indicators
    function_code: 3
    default_poll_hz: 1
    channels:
      - {key: cf_x, label: X acceleration peak factor, quantity: condition_indicator, unit: g, address: 0x47, scale: 0.001}
      - {key: kurtosis_x, label: X acceleration kurtosis, quantity: condition_indicator, unit: g, address: 0x48, scale: 0.001}
      - {key: abs_avg_x, label: X acceleration absolute average, quantity: condition_indicator, unit: g, address: 0x49, scale: 0.001}
      - {key: variance_x, label: X acceleration variance, quantity: condition_indicator, unit: g, address: 0x4A, scale: 0.001}
      - {key: rms_accel_x, label: X acceleration RMS, quantity: condition_indicator, unit: g, address: 0x4B, scale: 0.001}
      - {key: waveform_index_x, label: X acceleration waveform index, quantity: condition_indicator, unit: "1", address: 0x4C, scale: 0.001}
      - {key: peak_index_x, label: X acceleration peak index, quantity: condition_indicator, unit: g, address: 0x4D, scale: 0.001}
      - {key: pulse_coefficient_x, label: X acceleration pulse coefficient, quantity: condition_indicator, unit: "1", address: 0x4E, scale: 0.001}
      - {key: skewness_x, label: X acceleration skewness, quantity: condition_indicator, unit: g, address: 0x4F, scale: 0.001}
      - {key: rms_velocity_x, label: X velocity RMS, quantity: condition_indicator, unit: mm/s, address: 0x50, scale: 0.001}
      - {key: velocity_kurtosis_x, label: X velocity kurtosis, quantity: condition_indicator, unit: g, address: 0x51, scale: 0.001}
      - {key: rms_displacement_x, label: X displacement RMS, quantity: condition_indicator, unit: mm, address: 0x52, scale: 0.001}

  - key: condition_y
    label: Y-axis condition indicators
    function_code: 3
    default_poll_hz: 1
    channels:
      - {key: cf_y, label: Y acceleration peak factor, quantity: condition_indicator, unit: g, address: 0x53, scale: 0.001}
      - {key: kurtosis_y, label: Y acceleration kurtosis, quantity: condition_indicator, unit: g, address: 0x54, scale: 0.001}
      - {key: abs_avg_y, label: Y acceleration absolute average, quantity: condition_indicator, unit: g, address: 0x55, scale: 0.001}
      - {key: variance_y, label: Y acceleration variance, quantity: condition_indicator, unit: g, address: 0x56, scale: 0.001}
      - {key: rms_accel_y, label: Y acceleration RMS, quantity: condition_indicator, unit: g, address: 0x57, scale: 0.001}
      - {key: waveform_index_y, label: Y acceleration waveform index, quantity: condition_indicator, unit: "1", address: 0x58, scale: 0.001}
      - {key: peak_index_y, label: Y acceleration peak index, quantity: condition_indicator, unit: g, address: 0x59, scale: 0.001}
      - {key: pulse_coefficient_y, label: Y acceleration pulse coefficient, quantity: condition_indicator, unit: "1", address: 0x5A, scale: 0.001}
      - {key: skewness_y, label: Y acceleration skewness, quantity: condition_indicator, unit: g, address: 0x5B, scale: 0.001}
      - {key: rms_velocity_y, label: Y velocity RMS, quantity: condition_indicator, unit: mm/s, address: 0x5C, scale: 0.001}
      - {key: velocity_kurtosis_y, label: Y velocity kurtosis, quantity: condition_indicator, unit: g, address: 0x5D, scale: 0.001}
      - {key: rms_displacement_y, label: Y displacement RMS, quantity: condition_indicator, unit: mm, address: 0x5E, scale: 0.001}

  - key: condition_z
    label: Z-axis condition indicators
    function_code: 3
    default_poll_hz: 1
    channels:
      - {key: cf_z, label: Z acceleration peak factor, quantity: condition_indicator, unit: g, address: 0x5F, scale: 0.001}
      - {key: kurtosis_z, label: Z acceleration kurtosis, quantity: condition_indicator, unit: g, address: 0x60, scale: 0.001}
      - {key: abs_avg_z, label: Z acceleration absolute average, quantity: condition_indicator, unit: g, address: 0x61, scale: 0.001}
      - {key: variance_z, label: Z acceleration variance, quantity: condition_indicator, unit: g, address: 0x62, scale: 0.001}
      - {key: rms_accel_z, label: Z acceleration RMS, quantity: condition_indicator, unit: g, address: 0x63, scale: 0.001}
      - {key: waveform_index_z, label: Z acceleration waveform index, quantity: condition_indicator, unit: "1", address: 0x64, scale: 0.001}
      - {key: peak_index_z, label: Z acceleration peak index, quantity: condition_indicator, unit: g, address: 0x65, scale: 0.001}
      - {key: pulse_coefficient_z, label: Z acceleration pulse coefficient, quantity: condition_indicator, unit: "1", address: 0x66, scale: 0.001}
      - {key: skewness_z, label: Z acceleration skewness, quantity: condition_indicator, unit: g, address: 0x67, scale: 0.001}
      - {key: rms_velocity_z, label: Z velocity RMS, quantity: condition_indicator, unit: mm/s, address: 0x68, scale: 0.001}
      - {key: velocity_kurtosis_z, label: Z velocity kurtosis, quantity: condition_indicator, unit: g, address: 0x69, scale: 0.001}
      - {key: rms_displacement_z, label: Z displacement RMS, quantity: condition_indicator, unit: mm, address: 0x6A, scale: 0.001}

  # Manual 10.4.14. Opaque vendor words, no scaling given and no bit meanings
  # documented. Surfaced verbatim as diagnostics; never interpreted.
  - key: fault_diagnosis
    label: Per-axis fault diagnosis words
    function_code: 3
    default_poll_hz: 1
    channels:
      - {key: fault_x, label: X-axis fault diagnosis, quantity: fault_code, unit: bitfield, address: 0x6B, data_type: uint16}
      - {key: fault_y, label: Y-axis fault diagnosis, quantity: fault_code, unit: bitfield, address: 0x6C, data_type: uint16}
      - {key: fault_z, label: Z-axis fault diagnosis, quantity: fault_code, unit: bitfield, address: 0x6D, data_type: uint16}

protected_commands:
  - {key: save_config, label: Save / reboot / restore factory settings, address: 0x00, requires_step_up: true, description: "Manual 10.4.1. Never issued during discovery."}
  - {key: set_baud, label: Change baud rate, address: 0x04, requires_step_up: true, description: "Manual 10.4.2. Drops the bus until the poller reconnects."}
  - {key: set_slave_id, label: Change device address, address: 0x1A, requires_step_up: true, description: "Manual 10.4.3. Risk of address collision on a multi-drop bus."}

limitations:
  - "Reports reduced aggregates (RMS velocity, displacement, dominant frequency), not raw waveform. Spectral analysis of these channels describes slow trends, not machine vibration spectra."
  - "Registers 0x3D-0x3F are documented as Reserved and read zero."
  - "Registers 0x37-0x39 are live but absent from the manufacturer register table; excluded as unsupported."
  - "All six velocity and displacement channels are confirmed working on a healthy unit (2026-07-31, 1509 samples, three-axis excitation). A first unit reported VY/VZ/DY/DZ as exactly zero in 1505/1505 samples and is faulty, not representative: firmware Version 10059 is sound. Commissioning should confirm all three axes respond before a sensor is trusted. See docs/register-maps.md."
  - "Statistical feature blocks (0x47-0x6A) and spectrum energy blocks (0x6E-0x9A) are documented but not yet modelled in this profile."
