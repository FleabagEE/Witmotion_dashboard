schema_version: "1.0"
profile_version: "0.1.0"
manufacturer: WitMotion
model: WTVB01-485
protocol: modbus_rtu

# UNVERIFIED. The addresses below are a starting hypothesis only. They have not
# been confirmed against the WTVB01-485 register table or the connected unit, and
# the acquisition engine will refuse to drive alarms from this profile until
# verification_status is raised to "verified" by tools/probe.py plus a signed-off
# entry in docs/register-maps.md.
verification_status: unverified
verification_notes: >-
  Hypothesis pending hardware confirmation. Run tools/probe.py to dump 0x30-0x50
  from the connected unit. Temperature is the fastest confirmation: it should
  read near ambient (roughly 2000-3000 raw at 0.01 degC per count). Vibration
  velocity, displacement and dominant frequency are believed to be direct
  engineering integers rather than full-scale ratios; confirm by exciting the
  sensor and checking that velocity tracks displacement times frequency.

  SUSPECTED WRONG - velocity scale. Simulation at scale 1.0 gives 1 mm/s
  resolution. ISO 10816 zone boundaries are 1.12, 2.8 and 7.1 mm/s, so a
  1 mm/s step cannot separate "good" from "unsatisfactory" and no vendor would
  ship that for condition monitoring. Expect the true scale to be finer, most
  likely 0.1 mm/s per count. Confirm during commissioning by comparing the
  reading against a calibrated reference or by checking whether a slow change in
  excitation moves the register in steps of more than one count.

serial:
  baud: 9600
  default_slave_id: 0x50
  turnaround_ms: 5.0
  supported_bauds: [4800, 9600, 19200, 38400, 57600, 115200, 230400]

register_groups:
  - key: vibration
    label: Vibration velocity, angle, temperature, displacement and frequency
    function_code: 3
    default_poll_hz: 5
    channels:
      - {key: vib_velocity_x, label: Vibration velocity X, quantity: vibration_velocity, unit: mm/s, address: 0x34, minimum: 0, maximum: 1000}
      - {key: vib_velocity_y, label: Vibration velocity Y, quantity: vibration_velocity, unit: mm/s, address: 0x35, minimum: 0, maximum: 1000}
      - {key: vib_velocity_z, label: Vibration velocity Z, quantity: vibration_velocity, unit: mm/s, address: 0x36, minimum: 0, maximum: 1000}
      - {key: vib_angle_x, label: Vibration angle X, quantity: vibration_angle, unit: deg, address: 0x37, scale: 0.0054931640625, minimum: -180, maximum: 180}
      - {key: vib_angle_y, label: Vibration angle Y, quantity: vibration_angle, unit: deg, address: 0x38, scale: 0.0054931640625, minimum: -180, maximum: 180}
      - {key: vib_angle_z, label: Vibration angle Z, quantity: vibration_angle, unit: deg, address: 0x39, scale: 0.0054931640625, minimum: -180, maximum: 180}
      - {key: temperature, label: Temperature, quantity: temperature, unit: degC, address: 0x3A, scale: 0.01, minimum: -40, maximum: 125}
      - {key: vib_displacement_x, label: Vibration displacement X, quantity: vibration_displacement, unit: um, address: 0x3B, minimum: 0, maximum: 65535}
      - {key: vib_displacement_y, label: Vibration displacement Y, quantity: vibration_displacement, unit: um, address: 0x3C, minimum: 0, maximum: 65535}
      - {key: vib_displacement_z, label: Vibration displacement Z, quantity: vibration_displacement, unit: um, address: 0x3D, minimum: 0, maximum: 65535}
      - {key: vib_frequency_x, label: Dominant frequency X, quantity: dominant_frequency, unit: Hz, address: 0x3E, minimum: 0, maximum: 1000}
      - {key: vib_frequency_y, label: Dominant frequency Y, quantity: dominant_frequency, unit: Hz, address: 0x3F, minimum: 0, maximum: 1000}
      - {key: vib_frequency_z, label: Dominant frequency Z, quantity: dominant_frequency, unit: Hz, address: 0x40, minimum: 0, maximum: 1000}

protected_commands:
  - {key: save_config, label: Save configuration, address: 0x00, requires_step_up: true, description: "Persists settings to flash. Never issued during discovery."}
  - {key: set_baud, label: Change baud rate, address: 0x04, requires_step_up: true, description: "Changing baud will drop the bus until the poller reconnects."}
  - {key: set_slave_id, label: Change Modbus address, address: 0x1A, requires_step_up: true, description: "Risk of address collision on a multi-drop bus."}

limitations:
  - "Register addresses are unverified; this profile cannot drive alarms until confirmed on hardware."
  - "The device reports reduced aggregates (RMS velocity, displacement, dominant frequency), not raw waveform."
  - "Acceleration is not exposed: it is not confirmed as a readable channel on this firmware and must not be inferred."
  - "Spectral analysis of these channels describes slow trends, not machine vibration spectra; the device performs its own frequency estimation internally."
