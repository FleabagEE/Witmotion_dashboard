# Application-tier services for the QuakeVault industrial appliance.
#
# Acquisition is NOT here. It runs on the host as a hardened systemd unit
# (ADR-003) so that restarting, upgrading or breaking anything below keeps the
# sensors being polled and the measurements spooled to disk.
#
# Host Redis already occupies 6379, so ours is published on 6380 to keep the
# appliance self-contained rather than sharing an instance we do not control.

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg18
    container_name: qv-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_DB: quakevault
      POSTGRES_USER: quakevault
      # Overridden by .env in any real deployment; the installer generates one.
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-in-env}
      # Sensor data is append-heavy; give the planner room to keep indexes warm.
      TIMESCALEDB_TELEMETRY: "off"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 changed the recommended layout: mount the parent directory,
      # not .../data. The server then keeps its cluster in a major-version
      # subdirectory, which is what lets `pg_upgrade --link` run later without
      # crossing a mount boundary. Mounting .../data on 18+ makes the container
      # refuse to start.
      - qv_timescale_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quakevault -d quakevault"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:8-alpine
    container_name: qv-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy noeviction
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - qv_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Published on 1884: the host's 1883 already belongs to another product, and
  # sharing a broker would couple this appliance's topics to software it does
  # not control.
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: qv-mosquitto
    restart: unless-stopped
    ports:
      - "127.0.0.1:1884:1883"
    volumes:
      - ./deploy/mosquitto/config:/mosquitto/config:ro
      - qv_mosquitto_data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 1883 -u quakevault -P \"$$MQTT_PASSWORD\" -t '$$SYS/broker/uptime' -C 1 -W 3 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 15s

volumes:
  qv_timescale_data:
  qv_redis_data:
  qv_mosquitto_data:
